<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consola nubeCITA</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#001519; --panel:#05252e; --panel2:#093039; --panel3:#0d3d47;
  --line:#14434e; --line2:#0b333c;
  --txt:#d6eef0; --mut:#7ea9ad; --acc:#00A2B0; --acc-dim:#0a4a52;
  --warm:#E5DC75; --ok:#3ecf7a; --warn:#f0b34c; --bad:#ff6161;
  --disp:"Space Grotesk",system-ui,sans-serif;
  --body:"Inter",system-ui,sans-serif;
  --mono:ui-monospace,"SFMono-Regular",Menlo,monospace;
  --shadow:0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;font:14px/1.5 var(--body);background:var(--bg);color:var(--txt)}
a{color:var(--acc)}
code,.mono{font-family:var(--mono);font-size:.92em}
code{background:var(--panel2);padding:1px 5px;border-radius:4px}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}

/* ── header ── */
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;
  padding:10px 20px;background:rgba(0,21,25,.92);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--txt)}
.logo svg{display:block}
.logo .name{font:700 18px/1 var(--disp);letter-spacing:-.02em}
.logo .name b{color:var(--acc);font-weight:700}
.tagline{color:var(--mut);font-size:12px}
header .who{margin-left:auto;display:flex;align-items:center;gap:10px;color:var(--mut);font-size:13px}
.syncdot{width:8px;height:8px;border-radius:50%;background:var(--ok);opacity:.35;transition:opacity .3s,transform .3s}
.syncdot.pulse{opacity:1;transform:scale(1.3)}
.tabs{display:flex;gap:4px;margin-left:18px}
.tabs button{background:none;border:0;color:var(--mut);font:500 13px var(--body);
  padding:7px 12px;border-radius:7px;cursor:pointer;transition:background .15s,color .15s}
.tabs button:hover{color:var(--txt);background:var(--panel2)}
.tabs button.on{color:var(--txt);background:var(--panel2);box-shadow:inset 0 -2px 0 var(--acc)}

main{padding:20px;max-width:1240px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.card h2{margin:0 0 12px;font:500 12px/1 var(--body);color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
.card h3{margin:0 0 8px;font:600 15px/1.3 var(--disp)}
.mt{margin-top:16px}

label{display:block;font-size:12px;color:var(--mut);margin:10px 0 3px}
input,select,textarea{width:100%;padding:8px 10px;background:var(--panel2);
  border:1px solid var(--line);border-radius:8px;color:var(--txt);font:14px var(--body);
  transition:border-color .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}
input.err{border-color:var(--bad)}
input[type=number]{-moz-appearance:textfield}
.fld{margin-bottom:2px}
.fld .ferr{color:var(--bad);font-size:12px;min-height:15px;margin-top:3px}

button{background:var(--acc);border:0;color:#00282F;padding:8px 14px;border-radius:8px;
  font:600 13px var(--body);cursor:pointer;transition:filter .15s,background .15s,border-color .15s,opacity .15s}
button:hover:not(:disabled){filter:brightness(1.1)}
button:disabled{opacity:.5;cursor:wait}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--mut);font-weight:500}
button.ghost:hover:not(:disabled){color:var(--txt);border-color:var(--mut)}
button.danger{background:transparent;border:1px solid #5a2a2a;color:var(--bad);font-weight:500}
button.danger:hover:not(:disabled){background:#2a1515}
button.sm{padding:4px 10px;font-size:12px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:0}
.btnwrap{display:inline-flex;align-items:center;gap:7px}
.spin{width:12px;height:12px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;
  border-radius:50%;display:inline-block;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--mut);text-align:left;font-weight:500;border-bottom:1px solid var(--line);
  padding:7px 8px;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
td{padding:9px 8px;border-bottom:1px solid var(--line2);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{transition:background .12s}
tbody tr:hover{background:rgba(0,162,176,.08)}
tr.rowdead td{opacity:.45}
tr.rowdead td:first-child b{font-weight:400;text-decoration:line-through}

.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:600;white-space:nowrap}
.pill::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px;background:currentColor;vertical-align:1px}
.pill.running{background:#12301f;color:var(--ok)}
.pill.stopped{background:#3a2c14;color:var(--warn)}
.pill.deleted,.pill.absent{background:#33181c;color:var(--bad)}
.pill.pending,.pill.other,.pill.unknown{background:#232c40;color:var(--mut)}
.pill.drift{background:#42320f;color:var(--warn);margin-left:6px}
.pill.provisioning{background:#12301f;color:var(--acc);animation:blink 1.2s ease-in-out infinite}
.pill.t_open,.pill.t_in_progress{background:#232c40;color:var(--mut)}
.pill.t_resolved{background:#12301f;color:var(--ok)}
.pill.t_closed{background:#33181c;color:var(--bad)}
@keyframes blink{50%{opacity:.45}}

.bar{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden;margin:5px 0 2px}
.bar>i{display:block;height:100%;background:var(--acc);border-radius:4px;transition:width .4s}
.bar.warn>i{background:var(--warn)}
.bar.full>i{background:var(--bad)}
.qrow{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;margin-top:12px;gap:10px}
.qrow .val{color:var(--mut);font-family:var(--mono);font-size:12px}

.stat{display:flex;flex-direction:column;gap:2px;padding:12px 14px;background:var(--panel);
  border:1px solid var(--line);border-radius:12px}
.stat .k{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.07em}
.stat .v{font:700 24px/1.1 var(--disp);letter-spacing:-.02em}
.stat .v small{font:500 13px var(--body);color:var(--mut)}
.stat .pct{font-size:11px;color:var(--mut)}
.statrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.lowbal{margin-top:10px;padding:10px 14px;border-radius:12px;font-size:13px;background:#3d3312;
  border:1px solid var(--warn);color:var(--warn)}

.msg{font-size:13px;margin-top:10px;min-height:0}
.msg.err{color:var(--bad)} .msg.ok{color:var(--ok)} .msg.info{color:var(--mut)}
.muted{color:var(--mut)}
.warn{color:var(--warn)}
.empty{color:var(--mut);font-size:13px;padding:14px 4px;text-align:center}

/* ── toasts ── */
#toasts{position:fixed;top:14px;right:14px;z-index:80;display:flex;flex-direction:column;gap:8px;
  width:min(360px,calc(100vw - 28px));pointer-events:none}
.toast{pointer-events:auto;background:var(--panel3);border:1px solid var(--line);
  border-left:3px solid var(--acc);border-radius:9px;padding:10px 12px;font-size:13px;
  box-shadow:var(--shadow);display:flex;gap:9px;align-items:flex-start;
  animation:tin .18s ease-out}
.toast.ok{border-left-color:var(--ok)} .toast.err{border-left-color:var(--bad)}
.toast .ticon{font-size:14px;line-height:1.3}
.toast .tx{flex:1}
.toast .tc{background:none;border:0;color:var(--mut);cursor:pointer;font-size:15px;padding:0 2px;line-height:1.2}
.toast.bye{animation:tout .25s ease-in forwards}
@keyframes tin{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes tout{to{transform:translateX(24px);opacity:0}}

/* ── login ── */
#login{max-width:400px;margin:9vh auto 0}
#login .card{padding:28px 28px 22px}
.brandblock{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.brandblock .name{font:700 26px/1 var(--disp);letter-spacing:-.02em}
.brandblock .name b{color:var(--acc)}
.brandblock .sub{font-size:12px;color:var(--mut);margin-top:3px}
.formbtn{width:100%;margin-top:16px;padding:10px;display:flex;align-items:center;justify-content:center;gap:8px}
.pwwrap{position:relative}
.pwwrap button{position:absolute;right:6px;top:6px;background:none;border:0;color:var(--mut);
  cursor:pointer;font-size:14px;padding:5px 6px;border-radius:6px}
.pwwrap button:hover{color:var(--txt);background:var(--panel2)}
.loginhint{font-size:12px;color:var(--mut);margin-top:12px;text-align:center}

/* -- footer colab -- */
footer.colab{padding:26px 20px 30px;text-align:center}
.colabrow{display:inline-flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center}
.colab img.unrn{height:20px;display:block}
.colab .cw,.colab .sw{font:600 13px var(--disp);letter-spacing:.14em;color:var(--mut);text-transform:uppercase}
.colab svg.nabla{height:26px;width:auto;display:block}

/* ── modal ── */
.modal{position:fixed;inset:0;background:rgba(0,12,14,.72);z-index:50;display:none;animation:fadein .15s ease-out}
.modal.show{display:block}
.modal .box{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(920px,94vw);height:min(580px,86vh);background:var(--panel);
  border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;
  box-shadow:var(--shadow)}
.modal .box .mbar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.termwrap{flex:1;min-height:0;background:#001c21;border-radius:8px;overflow:hidden}
/* confirm */
.modal .cbox{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(460px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:20px;box-shadow:var(--shadow)}
.modal .cbox h3{margin:0 0 8px;font:600 16px var(--disp)}
.modal .cbox p{margin:0 0 16px;color:var(--mut);font-size:13px}
.modal .cbox .cbtns{display:flex;gap:10px;justify-content:flex-end}
@keyframes fadein{from{opacity:0}to{opacity:1}}

/* ── filters ── */
.filt{display:flex;gap:4px;margin-bottom:10px}
.srch{background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--txt);
  font:400 12px var(--body);padding:5px 10px;width:170px}
.srch::placeholder{color:var(--mut)}
.srch:focus{outline:none;border-color:var(--acc)}
.filt button{background:none;border:0;color:var(--mut);font:500 12px var(--body);
  padding:5px 11px;border-radius:99px;cursor:pointer}
.filt button:hover{color:var(--txt)}
.filt button.on{background:var(--panel2);color:var(--txt);box-shadow:inset 0 -1px 0 var(--acc)}

.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
pre.codebox{background:var(--panel2);padding:10px 12px;border-radius:8px;overflow:auto;
  font:12px/1.55 var(--mono);margin:6px 0;position:relative}
.copybtn{position:absolute;top:8px;right:8px;background:var(--panel3);border:1px solid var(--line);
  color:var(--mut);border-radius:6px;font-size:11px;padding:3px 9px;cursor:pointer}
.copybtn:hover{color:var(--txt);border-color:var(--mut)}

.hint{font-size:12px;color:var(--mut);margin-top:8px}

/* ── banda de incidentes (admin overview) ── */
.incband{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:10px 14px;border-radius:10px;
  border:1px solid var(--line);border-left:4px solid var(--acc);background:var(--panel);
  font-size:13px;margin-bottom:14px}
.incband.ok{border-left-color:var(--ok);background:#0d2417}
.incband.warn{border-left-color:var(--warn);background:#231b0b}
.incband .sep{color:var(--mut)}
.incband .driftwarn{color:var(--warn);font-weight:600}
.incband .provwarn{color:var(--warn)}
/* ── drawer de edición (admin users) ── */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,94vw);z-index:40;background:var(--panel);
  border-left:1px solid var(--line);box-shadow:var(--shadow);transform:translateX(102%);
  transition:transform .25s ease;overflow-y:auto;padding:16px 18px}
.drawer.open{transform:translateX(0)}
.drawer .dhead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.drawer .dhead h2{margin:0;flex:1;font:600 15px/1.3 var(--disp)}
.drawer .dhead button{background:none;border:0;color:var(--mut);font-size:16px;cursor:pointer;padding:2px 4px}
.drawer .dhead button:hover{color:var(--txt)}
/* ── drawer detalle (cliente) ── */
.clDrawer{position:fixed;right:0;top:0;bottom:0;width:min(440px,92vw);background:var(--panel);
  border-left:1px solid var(--line);z-index:45;transform:translateX(105%);transition:transform .22s;
  padding:18px;overflow-y:auto;box-shadow:var(--shadow)}
.clDrawer.open{transform:none}
.clDrawer .dh{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.clDrawer .dh b{font:600 16px/1.3 var(--disp)}
.clDrawer .dh button{margin-left:auto;background:none;border:0;color:var(--mut);font-size:16px;cursor:pointer}
.clDrawer .sec{margin-top:14px}
.clDrawer .sec .k{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.07em;margin-bottom:3px}
.clDrawer .sec .v{font-size:14px}
.clDrawer .dacts{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
#clDrawerOv{position:fixed;inset:0;background:rgba(0,12,14,.45);z-index:44;display:none}
#clDrawerOv.show{display:block}
/* ── presets del wizard ── */
.presetrow{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px;align-items:center}
.presetrow .ptip{color:var(--mut);font-size:12px;margin-right:2px}
.presetrow button{background:var(--panel2);border:1px solid var(--line);color:var(--txt);
  font:500 12px var(--body);padding:6px 11px;border-radius:99px;cursor:pointer}
.presetrow button:hover{border-color:var(--mut)}
.presetrow button.on{box-shadow:inset 0 -2px 0 var(--acc);border-color:var(--acc)}
.hint .ndiff{color:var(--warn)}
/* ── skeleton loaders ── */
.skl{background:var(--panel2);border-radius:5px;animation:blinker 1.3s ease-in-out infinite;margin:9px 8px}
.sklrow{display:flex;gap:8px}
.sklrow .skl{flex:1;height:16px;margin:0}
.costbox{background:var(--panel2);border:1px solid var(--line);border-radius:9px;
  padding:10px 12px;margin-top:14px}
.costbox .ck{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.07em}
.costbox .cv{font:600 15px var(--disp);color:var(--acc)}
@media (max-width:720px){
  .tabs{margin-left:0} header{flex-wrap:wrap}
  .tagline{display:none}
  main{padding:12px}
}
</style>
</head>
<body>
<header>
  <a class="logo" href="#" onclick="return false">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
      <path d="M7 18h9.5a3.5 3.5 0 0 0 .6-6.95 5 5 0 0 0-9.66-1.2A4 4 0 0 0 7 18Z"
            fill="#00A2B0" opacity=".95"/>
      <circle cx="16.5" cy="14.5" r="3.4" fill="#E5DC75" opacity=".85"/>
    </svg>
    <span class="name">nube<b>cita</b></span>
  </a>
  <span class="tagline">nube self-service</span>
  <nav class="tabs" id="tabs" style="display:none"></nav>
  <span class="who" id="who"></span>
  <span class="syncdot" id="syncdot" title="Actualización automática cada 30 s"></span>
  <button class="ghost sm" id="logoutBtn" style="display:none">Salir</button>
</header>

<main id="login">
  <div class="brandblock">
    <svg width="44" height="44" viewBox="0 0 24 24" fill="none">
      <path d="M7 18h9.5a3.5 3.5 0 0 0 .6-6.95 5 5 0 0 0-9.66-1.2A4 4 0 0 0 7 18Z" fill="#00A2B0"/>
      <circle cx="16.5" cy="14.5" r="3.4" fill="#E5DC75" opacity=".9"/>
    </svg>
    <div>
      <div class="name">nube<b>cita</b></div>
      <div class="sub">Tu nube, al tamaño que necesites</div>
    </div>
  </div>
  <div class="card">
    <label for="user">Usuario</label>
    <input id="user" placeholder="usuario" autocomplete="username">
    <label for="pass">Contraseña</label>
    <div class="pwwrap">
      <input id="pass" type="password" placeholder="contraseña" autocomplete="current-password" style="padding-right:40px">
      <button type="button" id="passToggle" title="Mostrar/ocultar contraseña" onclick="togglePass()">👁</button>
    </div>
    <button class="formbtn" id="loginBtn" onclick="doLogin(this)"><span class="tlabel">Entrar</span></button>
    <div id="loginMsg" class="msg"></div>
    <div class="loginhint">Servicio de cómputo CITA · UNRN</div>
  </div>
</main>

<main id="app" style="display:none"></main>

<footer class="colab" title="Colaboración UNRN × SURUS">
  <svg style="display:none" aria-hidden="true"><symbol id="nabla" viewBox="0 0 66 64"><path fill="#02A4B0" fill-rule="evenodd" transform="translate(-3 0)" d="M5.5 2.5H63.5L34 62ZM19 8L35.5 47L52 8Z"></path><path fill="#DCD878" fill-rule="evenodd" transform="translate(-1.5 0)" d="M5.5 2.5H63.5L34 62ZM19 8L35.5 47L52 8Z"></path><path fill="#303030" fill-rule="evenodd" d="M5.5 2.5H63.5L34 62ZM19 8L35.5 47L52 8Z"></path></symbol></svg>

<script>
let session=null;      // {role, token, clientId?}
let brand={name:"nubecita",domain:"nubecita.surus.lat"};
let adminTab="overview";
let clientFilter="active";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fdate=s=>s?String(s).slice(0,10):"—";
const fmtCr=x=>(Math.round((+x||0)*100)/100).toLocaleString("es-AR",{maximumFractionDigits:2});
function vmIp(ref,subnet){const v=parseInt(ref);if(isNaN(v)||!subnet)return"—";const p=((brand&&brand.vm_net)||"10.20.1").split(".");return`${p[0]}.${p[1]}.${subnet}.${v-6100+2}`;}
const sshDom=()=>brand.ssh_domain||"ssh.surus.lat";

async function api(path,method="GET",body,role){
  const r=await fetch(path,{method,headers:{
    "Authorization":"Bearer "+session.token,
    ...(body?{"Content-Type":"application/json"}:{})
  },body:body?JSON.stringify(body):undefined});
  let d=null; try{d=await r.json()}catch(e){}
  if(!r.ok) throw new Error((d&&(d.detail||d.message))||r.status+" "+r.statusText);
  return d;
}
/* ── data layer: cache TTL + dedupe in-flight ──
   cache[path] = {data,at,ttl} (fresco) | {p} (fetch en curso). ttl<=0 => no cachea. */
const _cache=new Map();
async function cachedApi(path,ttl=15000,opts){
  const e=_cache.get(path);
  if(e){
    if(e.p)return e.p;                              // dedupe: misma promesa en curso
    if(Date.now()-e.at<e.ttl)return e.data;         // cache fresco
  }
  const entry={};
  entry.p=api(path,opts&&opts.method,opts&&opts.body,opts&&opts.role)
    .then(d=>{if(_cache.get(path)===entry&&ttl>0)_cache.set(path,{data:d,at:Date.now(),ttl});return d;})
    .catch(err=>{if(_cache.get(path)===entry)_cache.delete(path);throw err;});
  _cache.set(path,entry);
  return entry.p;
}
function cacheBust(prefix){for(const k of _cache.keys())if(k.startsWith(prefix))_cache.delete(k);}
/* ═══ UI Kit Cloud — Web Components (light DOM: el CSS global .pill/.bar sigue aplicando) ═══ */
const NC_STAT=["running","stopped","deleted","absent","provisioning"];
customElements.define("nc-pill",class extends HTMLElement{
  static get observedAttributes(){return ["status"];}
  connectedCallback(){this._draw();}
  attributeChangedCallback(){this._draw();}
  _draw(){const st=this.getAttribute("status")||"";
    const k=NC_STAT.includes(st)?st:"other";
    this.innerHTML=`<span class="pill ${k}">${esc(st||"unknown")}</span>`;}
});
customElements.define("nc-quota-bar",class extends HTMLElement{
  static get observedAttributes(){return ["used","quota"];}
  connectedCallback(){this._draw();}
  attributeChangedCallback(){this._draw();}
  _draw(){const u=+this.getAttribute("used")||0,q=+this.getAttribute("quota")||0;
    const p=q?Math.min(100,u/q*100):100,cls=q?(u/q>=1?"full":(u/q>=.8?"warn":"")):"";
    this.innerHTML=`<div class="bar ${cls}"><i style="width:${p}%"></i></div>`;}
});
// timestamp relativo ("hace X min") — un solo tick global compartido, no por elemento
let _ncTimeTimer=null;
function _ncTick(){for(const el of document.querySelectorAll("nc-time"))el._draw();}
customElements.define("nc-time",class extends HTMLElement{
  static get observedAttributes(){return ["ts"];}
  connectedCallback(){this._draw();if(!_ncTimeTimer)_ncTimeTimer=setInterval(_ncTick,30000);}
  disconnectedCallback(){if(document.querySelector("nc-time")===null&&_ncTimeTimer){clearInterval(_ncTimeTimer);_ncTimeTimer=null;}}
  attributeChangedCallback(){this._draw();}
  _draw(){let t=this.getAttribute("ts")||"";
    // formato SQLite "YYYY-MM-DD HH:MM:SS" (UTC del server) → parseable
    const d=new Date(t.includes("T")?t:t.replace(" ","T")+"Z");
    if(isNaN(d)){this.textContent=esc(t);return;}
    const m=Math.round((Date.now()-d.getTime())/60000);
    this.textContent=m<1?"recién":m<60?`hace ${m} min`:m<1440?`hace ${Math.round(m/60)} h`:`hace ${Math.round(m/1440)} d`;
    this.title=d.toLocaleString();}
});
customElements.define("nc-skel-table",class extends HTMLElement{
  connectedCallback(){const r=+(this.getAttribute("rows")||3);
    const sk=`<div class="sklrow"><div class="skl" style="flex:2"></div><div class="skl"></div><div class="skl"></div><div class="skl" style="flex:.6"></div></div>`;
    this.innerHTML=`<div class="tblwrap">${sk.repeat(r)}</div>`;}
});
function pill(st){return `<nc-pill status="${esc(st||"")}"></nc-pill>`;}
function barCls(used,quota){const p=quota?used/quota:1;return p>=1?"full":(p>=.8?"warn":"");}
function bar(used,quota){return `<nc-quota-bar used="${used}" quota="${quota}"></nc-quota-bar>`;}
// umbral de cuota: rojo (>=100%) / ámbar (>=80%)
function qval(used,quota,unit=""){
  const p=quota?used/quota:1;
  const c=p>=1?"var(--bad)":(p>=.8?"var(--warn)":"");
  return `<span style="${c?`color:${c};font-weight:600;`:''}font-family:var(--mono);font-size:12px">${used}${unit?"/"+quota+unit:""}</span>`;
}
function setMsg(el,txt,cls){if(!el)return;el.textContent=txt;el.className="msg "+(cls||"");}
function busy(btn,label){if(!btn)return;if(!btn._lbl)btn._lbl=btn.innerHTML;
  btn.disabled=true;btn.innerHTML=`<span class="spin"></span><span>${label||btn._lbl}</span>`;}
function unbusy(btn){if(!btn)return;btn.disabled=false;if(btn._lbl)btn.innerHTML=btn._lbl;}
function flash(el){if(!el)return;el.classList.add("pulse");setTimeout(()=>el.classList.remove("pulse"),900);}

/* ── toasts ── */
function toast(msg,type="info",ttl=4500){
  const box=$("#toasts");
  const t=document.createElement("div");
  t.className="toast "+type;
  const icon=type==="ok"?"✔":type==="err"?"✖":"ℹ";
  t.innerHTML=`<span class="ticon">${icon}</span><span class="tx">${esc(msg)}</span><button class="tc" title="Cerrar">✕</button>`;
  t.querySelector(".tc").onclick=()=>dismiss();
  box.appendChild(t);
  while(box.children.length>4)box.firstChild.remove();
  let done=false;
  function dismiss(){if(done)return;done=true;t.classList.add("bye");setTimeout(()=>t.remove(),260);}
  if(ttl)setTimeout(dismiss,ttl);
}
const okT=(m)=>toast(m,"ok"); const errT=(m)=>toast(m,"err",7000);
/* Toast con botón copiar para tokens: el texto del token NUNCA se imprime */
function tokenCopyToast(title,token){
  const box=$("#toasts");
  const el=document.createElement("div");
  el.className="toast ok";
  el.innerHTML=`<span class="ticon">✔</span><span class="tx">${esc(title)} — <b>cópialo ahora, no se puede volver a leer</b></span>`;
  const cp=document.createElement("button");
  cp.className="tc"; cp.style.cssText="background:var(--acc-dim);color:var(--txt);border:0;border-radius:6px;padding:2px 9px;font-size:12px;cursor:pointer";
  cp.textContent="📋 copiar";
  cp.onclick=async()=>{
    try{await navigator.clipboard.writeText(token);cp.textContent="✔ copiado";okT("Token copiado");}
    catch(e){prompt("Copiá manualmente:",token);}
  };
  el.appendChild(cp);
  box.appendChild(el);
  while(box.children.length>4)box.firstChild.remove();
  let done=false;
  function dismiss(){if(done)return;done=true;el.classList.add("bye");setTimeout(()=>el.remove(),260);}
  const closeBtn=el.querySelector(".tc");
  el.addEventListener("dblclick",dismiss);
  setTimeout(dismiss,30000);
}

/* ── confirm modal ── */
let cfResolve=null;
function askConfirm(title,text,yesLabel="Borrar"){
  $("#cfTitle").textContent=title;$("#cfText").textContent=text;
  const y=$("#cfYes");y.textContent=yesLabel;y.className="danger";
  $("#confirmModal").classList.add("show");
  return new Promise(res=>{cfResolve=res;});
}
function closeConfirm(v){
  $("#confirmModal").classList.remove("show");
  if(cfResolve){const r=cfResolve;cfResolve=null;r(v);}
}
function closeAdmDrawer(){$("#admDrawer").classList.remove("open");}
function closeClDrawer(){$("#clDrawer").classList.remove("open");$("#clDrawerOv").classList.remove("show");}
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){
    if($("#admDrawer").classList.contains("open"))closeAdmDrawer();
    else if($("#clDrawer").classList.contains("open"))closeClDrawer();
    else if($("#confirmModal").classList.contains("show"))closeConfirm(false);
    else if($("#sshModal").classList.contains("show"))closeSsh();
  }
  if(e.key==="Enter"&&$("#login").style.display!=="none"){doLogin($("#loginBtn"));}
});

/* ══════════ LOGIN ══════════ */
function togglePass(){const p=$("#pass");p.type=p.type==="password"?"text":"password";}
async function doLogin(btn){
  const u=$("#user"),pw=$("#pass"),msg=$("#loginMsg");setMsg(msg,"");
  u.classList.remove("err");pw.classList.remove("err");
  if(!u.value.trim()||!pw.value){
    if(!u.value.trim())u.classList.add("err");
    if(!pw.value)pw.classList.add("err");
    setMsg(msg,"ingresá usuario y contraseña","err");return;
  }
  busy(btn,"Entrando…");
  try{
    const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({username:u.value.trim(),password:pw.value})});
    const d=await r.json();
    if(!r.ok) throw new Error(d.detail||r.status+" "+r.statusText);
    session={role:d.role,token:d.token};
    if(d.role==="client"){const q=await api("/quota");session.clientId=q.client_id;}
    sessionStorage.setItem("nubecita",JSON.stringify(session));
    enterApp();
  }catch(e){setMsg(msg,"❌ "+e.message,"err");}
  finally{unbusy(btn);}
}
$("#logoutBtn").onclick=()=>{
  session=null;sessionStorage.removeItem("nubecita");
  if(evWs){evWsAlive=false;try{evWs.close()}catch(e){}evWs=null;}setSyncDot();
  $("#app").style.display="none";$("#app").innerHTML="";$("#tabs").style.display="none";
  $("#login").style.display="";$("#who").textContent="";$("#logoutBtn").style.display="none";
  $("#user").value="";$("#pass").value="";
  toast("Sesión cerrada","info",2500);
};

function enterApp(){
  $("#login").style.display="none";$("#app").style.display="";
  $("#logoutBtn").style.display="";
  $("#who").textContent=session.role==="admin"?"admin · "+brand.domain:session.clientId+" · "+brand.domain;
  if(session.role==="admin"){$("#tabs").style.display="";renderTabs();}
  enterApp.timer&&clearInterval(enterApp.timer);
  enterApp.timer=setInterval(autoRefresh,30000);
  connectEvents();
  render();
}

/* ── WS /ws/events: estado de recursos en tiempo real ──
   Abierto al entrar a la app; si cierra (p. ej. reinicio del backend) se
   reconecta solo en 10 s. El auto-refresh de 30 s queda como safety net:
   si el WS falla, todo sigue funcionando por polling. */
let evWs=null,evWsAlive=false;
function setSyncDot(){
  const dot=$("#syncdot");if(!dot)return;
  dot.title=evWsAlive?"ws: tiempo real (fallback polling 30 s)":"Actualización automática cada 30 s";
}
function connectEvents(){
  if(!session)return;
  if(evWs&&(evWs.readyState===WebSocket.CONNECTING||evWs.readyState===WebSocket.OPEN))return;
  const proto=location.protocol==="https:"?"wss":"ws";
  const ws=new WebSocket(`${proto}://${location.host}/ws/events?token=${encodeURIComponent(session.token)}`);
  evWs=ws;
  ws.onopen=()=>{evWsAlive=true;setSyncDot();};
  ws.onmessage=e=>{
    let d;try{d=JSON.parse(e.data)}catch(err){return;}
    if(d.type==="hello"){evWsAlive=true;setSyncDot();return;}
    if(d.type!=="resource")return;
    applyResourceEvent(d);
  };
  ws.onclose=()=>{evWsAlive=false;evWs=null;setSyncDot();setTimeout(connectEvents,10000);};
  ws.onerror=()=>{try{ws.close()}catch(err){}};
}
function applyResourceEvent(d){
  // kind del evento: 'vm' | 'svc' (ref = vmid o job_id)
  if(session.role==="client"){
    if(d.client_id!==session.clientId)return; // solo mi rol
    if(d.kind==="vm"){
      const row=vmsCache.l.find(x=>String(x.ref_id)===String(d.ref));
      if(row)row.status=d.status;
      drawVms(vmsCache.l); // re-dibuja solo la tabla de VMs
    }else{
      const row=svcsCache.l.find(x=>String(x.ref_id)===String(d.ref));
      if(row)row.status=d.status;
      drawSvcs(svcsCache.l); // re-dibuja solo la tabla de servicios
    }
  }else if(session.role==="admin"){
    // admin: re-dibuja solo la pestaña de recursos si está visible
    if(adminBundleP&&adminTab==="resources"&&$("#resList"))renderResources();
  }
}
/* Bundle admin diferido: app-admin.js se inyecta SOLO para role=admin;
   los clientes nunca lo piden ni lo ejecutan. */
let adminBundleP=null;
function loadAdminBundle(){
  if(adminBundleP)return adminBundleP;
  adminBundleP=new Promise((res,rej)=>{
    const s=document.createElement("script");
    s.src="/app-admin.js";
    s.onload=()=>res();
    s.onerror=()=>{adminBundleP=null;rej(new Error("no se pudo cargar app-admin.js"));};
    document.head.appendChild(s);
  });
  return adminBundleP;
}
function renderTabs(){
  const tabs=[["overview","Resumen"],["resources","Recursos"],["users","Usuarios / Clientes"],["tickets","Tickets"]];
  $("#tabs").innerHTML=tabs.map(([k,l])=>
    `<button data-tab="${k}" class="${k===adminTab?"on":""}" onclick="setTab('${k}')">${l}</button>`).join("");
}
function setTab(t){adminTab=t;renderTabs();render();}
function autoRefresh(){
  if(!session)return;
  if(session.role==="admin"){if(adminBundleP)adminRender();}else clientData();
  flash($("#syncdot"));
}

async function render(){
  const a=$("#app"); if(!session)return;
  a.dataset.role=session.role;
  try{
    if(session.role==="admin"){await loadAdminBundle();await renderAdmin();}
    else await renderClient();
  }catch(e){errT(e.message);}
}

async function renderClient(){
  const a=$("#app");
  if(!a.querySelector("#clientRoot")) {a.innerHTML=clientHtml();renderClTabs();}
  await clientData();
}

function skelTable(){return `<nc-skel-table rows="3" cols="6"></nc-skel-table>`;}
let clientDataLoaded=false;
async function clientData(){
  if(!clientDataLoaded){ // primera carga: skeletons mientras llegan los datos
    const v=$("#vms"),s=$("#svcs");
    if(v)v.innerHTML=skelTable();
    if(s)s.innerHTML=skelTable();
  }
  const [q,vms,svs,cr]=await Promise.all([cachedApi("/quota",15000),api("/vm"),api("/service"),cachedApi("/me/credits",15000).catch(()=>null)]);
  clientDataLoaded=true;
  const u=q.used,qu=q.quota;
  const pct=(a,b)=>b?Math.round(a/b*100)+"%":"—";
  const used=(k,uk,qq,unit="")=>`<div class="stat"><span class="k">${k}</span>
    <span class="v">${uk}<small> / ${qq}${unit}</small></span>${bar(uk,qq)}
    <span class="pct">${pct(uk,qq)} usado</span></div>`;
  const crStat=cr?`<div class="stat"><span class="k">Créditos</span>
    <span class="v">${fmtCr(cr.credits)}</span>
    <span class="pct">${cr.cost_per_hour>0?`${fmtCr(cr.cost_per_hour)} cr/h · ~${cr.hours_left} h restantes`:"sin consumo (VMs detenidas)"}</span></div>`:"";
  $("#quotaStats").innerHTML=
    used("CPU",u.vm_cpu+u.c_cpu,qu.cpu," cores")+
    used("RAM",(u.vm_ram+u.c_ram)/1024,qu.ram_mb/1024," GB")+
    used("Disco",u.vm_disk+u.c_disk,qu.disk_gb," GB")+
    used("VMs",u.vms,qu.max_vms)+
    used("Servicios",u.containers,qu.max_containers)+crStat;
  $("#lowBal").innerHTML=cr&&cr.low_balance
    ?`<div class="lowbal">⚠ Quedan ~${Math.max(1,Math.ceil(cr.hours_left))} h de saldo — recargá créditos o detené VMs.</div>`
    :"";
  drawVms(vms);drawSvcs(svs);
  refreshFilt();
}

// consumo de créditos: tabla por día (delta con color ok/bad + mini barra) + desglose por VM
async function loadUsage(){
  const host=$("#usageDaily"); if(!host)return;
  let d; try{d=await api("/me/usage?days=30");}
  catch(e){host.innerHTML=`<div class="msg err">${esc(e.message)}</div>`;return;}
  host.innerHTML=d.by_day.length
    ?`<div class="tblwrap"><table><tr><th>Fecha</th><th>Delta (cr)</th><th>Eventos</th><th style="width:25%"></th></tr>
      ${d.by_day.map(r=>{
        const neg=r.delta_net<0;
        const rows=[...d.by_day].map(x=>Math.abs(x.delta_net)).sort((a,b)=>a-b);
        const p=rows.length?Math.max(2,Math.round(Math.abs(r.delta_net)/rows[rows.length-1]*100)):0;
        return `<tr>
          <td class="muted" style="font-size:12px">${fdate(r.date)}</td>
          <td class="mono" style="font-size:12px;color:${neg?"var(--bad)":"var(--ok)"}">${neg?"":"+"}${fmtCr(r.delta_net)}</td>
          <td class="muted" style="font-size:12px">${r.events_n}</td>
          <td><div class="bar" style="margin:0"><i style="width:${p}%"></i></div></td></tr>`;}).join("")}
      </table></div>`
    :`<div class="empty">Sin consumo en los últimos 30 días.</div>`;
  const br=$("#usageByRes");
  if(!br)return;
  br.innerHTML=d.by_resource
    ?`<div class="hint" style="margin-top:10px">Desglose por recurso (facturación solo):</div>
      <div class="tblwrap" style="margin-top:4px"><table><tr><th>Recurso</th><th>Delta (cr)</th></tr>
      ${Object.entries(d.by_resource).sort((a,b)=>a[1]-b[1]).map(([k,v])=>
        `<tr><td class="mono" style="font-size:12px">${esc(k)}</td>
         <td class="mono" style="font-size:12px;color:${v<0?"var(--bad)":"var(--ok)"}">${v<0?"":"+"}${fmtCr(v)}</td></tr>`).join("")}
      </table></div>`
    :"";
}
async function loadCfgData(){
  try{
    const [keys,pk]=await Promise.all([api("/me/ssh-keys"),api("/me/ssh-private-key").catch(()=>({has:false}))]);
    const list=(keys.ssh_key||"").split("\n").map(s=>s.trim()).filter(Boolean);
    const kl=$("#keysList"); if(kl)kl.innerHTML=list.length
      ?`<pre class="codebox" style="max-height:160px;margin:0 0 6px">${esc(keys.ssh_key)}</pre>
        <div class="msg ok" style="margin:0 0 10px">${list.length} clave(s) — se inyectan en VMs nuevas automáticamente.</div>`
      :`<div class="msg info" style="margin-bottom:10px">Sin claves cargadas: tus VMs no tendrán acceso SSH.</div>`;
    const ke=$("#keyEdit"); if(ke)ke.value=keys.ssh_key||"";
    const pm=$("#privMsg"); if(pm)pm.textContent=pk.has?"✔ Clave privada cargada (usada por la terminal SSH del navegador).":"";
  }catch(e){errT(e.message);}
  await loadTokens();
}
let lastNewToken=null; // {id,label,token} — el texto del token recién creado
async function loadTokens(){
  const host=$("#tokensList"); if(!host)return;
  let d; try{d=await api("/me/tokens");}
  catch(e){host.innerHTML=`<div class="msg err">${esc(e.message)}</div>`;return;}
  tokensCache=d.tokens;
  host.innerHTML=d.tokens.length
    ?`<div class="tblwrap"><table><tr><th>Token</th><th>Creado</th><th>Último uso</th><th></th></tr>
      ${d.tokens.map(t=>`<tr>
        <td class="mono" style="font-size:12px">${esc(t.label||"sin etiqueta")}${t.is_current?' <span class="pill other">este navegador</span>':""}</td>
        <td class="muted" style="font-size:12px">${fdate(t.created_at)}</td>
        <td class="muted" style="font-size:12px">${t.last_used_at?String(t.last_used_at).slice(0,16).replace("T"," ")+" UTC":"nunca"}</td>
        <td style="white-space:nowrap;text-align:right">
          <button class="ghost sm" onclick="renameToken('${esc(t.id)}',this)" title="Renombrar">✏️</button>
          ${t.is_current?"":`<button class="danger sm" onclick="revokeToken('${esc(t.id)}','${esc(t.label||"sin etiqueta")}',this)" title="Revocar">✕</button>`}
        </td></tr>`).join("")}
      </table></div>`
    :`<div class="empty">Sin tokens. Creá uno abajo para usar la API.</div>`;
  renderTokNew();
}
function renderTokNew(){
  const box=$("#tokNew"); if(!box)return;
  if(!lastNewToken){box.innerHTML="";return;}
  box.innerHTML=`<div class="msg ok" style="margin-top:12px">Token «${esc(lastNewToken.label)}» creado. <b>¡Cópialo ahora — no se puede volver a leer!</b></div>
    <pre class="codebox" style="margin:0 0 6px">${esc(lastNewToken.token)}<button class="copybtn" onclick="copyText(${JSON.stringify(lastNewToken.token)},this)">📋 copiar</button></pre>
    <div class="hint">Usalo así: <code>curl -H "Authorization: Bearer ${esc(lastNewToken.token)}" https://${esc(brand.domain)}/me/credits</code></div>`;
}
async function createToken(btn){
  busy(btn,"Creando…");
  try{
    const r=await api("/me/tokens","POST",{label:$("#tokLabel").value.trim()});
    lastNewToken={id:r.id,label:r.label,token:r.token};
    const l=$("#tokLabel"); if(l)l.value="";
    okT("Token creado (el texto se muestra una sola vez)");
    await loadTokens();
  }catch(e){errT(e.message);}
  finally{unbusy(btn);}
}
async function renameToken(id,btn){
  const cur=tokensCache.find(t=>t.id===id);
  const nl=prompt("Nueva etiqueta:",(cur&&cur.label)||"");
  if(nl===null)return;
  try{await api("/me/tokens/"+encodeURIComponent(id),"PATCH",{label:nl.trim()});okT("etiqueta actualizada");await loadTokens();}
  catch(e){errT(e.message);}
}
async function revokeToken(id,label,btn){
  if(!await askConfirm(`Revocar token «${label}»`,"Cualquier uso con este token deja de funcionar de inmediato. Esta acción no se puede deshacer."))return;
  if(btn)busy(btn,"Revocando…");
  try{await api("/me/tokens/"+encodeURIComponent(id),"DELETE");okT("token revocado");await loadTokens();}
  catch(e){errT(e.message);}
  finally{if(btn)unbusy(btn);}
}
let tokensCache=[];
function vmsCache(list){vmsCache.l=list;} vmsCache.l=[];
function svcsCache(list){svcsCache.l=list;} svcsCache.l=[];
function drawFilt(elId,key){
  const el=$("#"+elId);if(!el)return;
  const opts=key==="vm"
    ?[["all","Todas"],["running","Running"],["provisioning","Provisioning"],["stopped","Stopped"]]
    :[["all","Todas"],["running","Running"],["stopped","Stopped"]];
  el.innerHTML=opts.map(([k,l])=>`<button class="${k===clientFilter?"on":""}" onclick="setFilt('${key}','${k}')">${l}</button>`).join("");
}
function statusMatch(st){return clientFilter==="all"||st===clientFilter;}
function setFilt(key,v){
  if(key==="vm")clientFilter=v;
  drawFilt(key==="vm"?"vmFilt":"svFilt",key);
  if(key==="vm")drawVms(vmsCache.l);else drawSvcs(svcsCache.l);
}
let vmSearchQ=""; let svSearchQ="";
function clientSearch(key){
  const el=$(key==="vm"?"#vmSearch":"#svSearch");
  if(!el)return;
  const q=el.value.trim().toLowerCase();
  if(key==="vm"){vmSearchQ=q;drawVms(vmsCache.l);}
  else{svSearchQ=q;drawSvcs(svcsCache.l);}
}
function vmSearchMatch(r){
  if(!vmSearchQ)return true;
  const ip=vmIp(r.ref_id, r.subnet ?? r.client_subnet);
  return (r.name||"").toLowerCase().includes(vmSearchQ)||(ip&&ip!=="—"&&ip.includes(vmSearchQ));
}
function svSearchMatch(r){
  if(!svSearchQ)return true;
  return (r.name||"").toLowerCase().includes(svSearchQ);
}
function refreshFilt(){drawFilt("vmFilt","vm");drawFilt("svFilt","sv");}
function drawVms(vms){
  vmsCache.l=vms;
  const show=vms.filter(r=>statusMatch(r.status));
  const vis=show.filter(vmSearchMatch);
  const host=$("#vms");if(!host)return;
  if(!vis.length){
    host.innerHTML=`<div class="empty">${vmSearchQ
      ?`Sin VMs que coincidan con «${esc(vmSearchQ)}».`
      :(clientFilter==="all"
      ?"Sin VMs todavía. <button class=\"ghost sm\" style=\"margin-left:8px\" onclick=\"openCreate('vm')\">Crear una</button>"
      :"Sin VMs en ese estado.")}</div>`;
    drawFilt("vmFilt","vm");return;
  }
  host.innerHTML=`<div class="tblwrap"><table><tr><th>Nombre</th><th>SSH</th><th>CPU</th><th>RAM</th><th>Disco</th><th>IP</th><th>Estado</th><th></th></tr>
    ${vis.map(r=>`<tr class="${r.status==="deleted"?"rowdead":""}">
      <td><b style="cursor:pointer" onclick="openVmDetail('${esc(r.ref_id)}')">${esc(r.name)}</b>${(r.gpu_model||r.gpu_mapping)?` <span style="font-size:10px;background:var(--acc-dim);color:var(--warm);padding:1px 6px;border-radius:8px;vertical-align:middle">GPU${r.gpu_model?" "+esc(r.gpu_model):""}</span>`:""}</td>
      <td class="mono" style="font-size:12px">${r.host_id?esc(r.host_id+"@"+sshDom()):"—"}</td>
      <td>${r.cpu??"—"}</td><td>${r.ram_mb?Math.round(r.ram_mb/1024)+" GB":"—"}</td><td>${r.disk_gb?r.disk_gb+" GB":"—"}</td>
      <td class="mono" style="font-size:12px">${r.status==="deleted"?"—":vmIp(r.ref_id, r.subnet ?? r.client_subnet)}</td>
      <td>${pill(r.status)}</td>
      <td style="white-space:nowrap;text-align:right">${r.status!=="deleted"
        ?`${r.status==="stopped"?`<button class="ghost sm" onclick="vmPower('${esc(r.ref_id)}','start',this)" title="Arrancar VM">▶</button>`
          :r.status==="running"?`<button class="ghost sm" onclick="vmPower('${esc(r.ref_id)}','stop',this)" title="Detener VM">⏸</button>`
          :`<span style="opacity:.45;font-size:12px" title="En preparación — aún no se puede arrancar/detener">—</span>`}
          <button class="ghost sm" onclick="openSsh('${esc(r.ref_id)}','${esc(r.name)}')" title="Terminal SSH en el navegador">🖥</button>
          <button class="ghost sm" onclick="copyText('ssh ${esc(r.host_id)}@${esc(sshDom())}',this)" title="Copiar comando SSH">📋</button>
          <button class="ghost sm" onclick="refreshKeys('${esc(r.ref_id)}','${esc(r.name)}')" title="Reinyectar mis claves SSH en esta VM">🔑</button>
          <button class="danger sm" onclick="delVm('${esc(r.ref_id)}','${esc(r.name)}',this)">✕</button>`:""}</td></tr>`).join("")}
  </table></div>`;
}
function drawSvcs(svs){
  svcsCache.l=svs;
  const show=svs.filter(r=>statusMatch(r.status));
  const vis=show.filter(svSearchMatch);
  const host=$("#svcs");if(!host)return;
  if(!vis.length){
    host.innerHTML=`<div class="empty">${svSearchQ?`Sin servicios que coincidan con «${esc(svSearchQ)}».`
      :(clientFilter==="all"?"Sin servicios todavía.":"Sin servicios en ese estado.")}</div>`;

/* Espeja _sanitename del backend: lowercase, [^a-z0-9-]→'-', colapso, max 20 */
function sanitizedName(name,fallback){
  const s=String(name||"").toLowerCase().trim().replace(/[^a-z0-9-]/g,"-").replace(/-+/g,"-").replace(/^-|-$/g,"").slice(0,20);
  return s||fallback;
}
function namePreview(){
  const el=$("#cNameOut"),inp=$("#cName");
  if(!el||!inp)return;
  const raw=inp.value.trim(),norm=sanitizedName(raw,"recurso");
  el.innerHTML=(raw&&norm!==raw.toLowerCase())
    ?`<div class="hint" style="margin-top:4px">Se creará como: <span class="ndiff">${esc(norm)}</span></div>`:"";
}

function pickPreset(name,btn){

  if(gpu&&name==="gpu"&&[...gpu.options].every(o=>o.value!==p.gpu))gpu.value=gpu.options[1]?gpu.options[1].value:p.gpu;

async function attachCostEstimator(m,kind){
  const box=m.querySelector("#cCost"); if(!box) return;
  let rates=null,credits=null;
  try{const [r,c]=await Promise.all([cachedApi("/me/rates",300000),cachedApi("/me/credits",15000).catch(()=>null)]);
    // /me/rates devuelve {rates_per_hour:{...}} (app.py my_rates); 'rates' solo
    // existe como fallback histórico. Sin esto el box quedaba oculto siempre.
    rates=(r&&(r.rates_per_hour||r.rates))||null;credits=(c&&typeof c.credits==="number")?c.credits:null;}catch(e){}
  if(!rates){box.style.display="none";return;} // sin tasas: ocultar sin romper el modal
  const num=el=>Math.max(0,parseFloat(el&&el.value)||0);
  const recalc=()=>{
    let cost=0;
    if(kind==="vm"){
      const cpu=num(m.querySelector("#cCpu")),ram=num(m.querySelector("#cRam")),disk=num(m.querySelector("#cDisk"));
      cost=cpu*(rates.cpu||0)+ram*(rates.ram_gb||0)+disk*(rates.disk_gb||0)
        +((m.querySelector("#cGpu")&&m.querySelector("#cGpu").value)?(rates.gpu||0):0);
    }else{
      const cpu=num(m.querySelector("#cCpu")),ram=num(m.querySelector("#cRam")),rep=num(m.querySelector("#cRep"));
      cost=(cpu*(rates.cpu||0)+ram/1024*(rates.ram_gb||0))*rep;
    }
    let html=`<div class="ck">Costo estimado</div><div class="cv">${fmtCr(cost)} créditos/hora</div>`;
    if(credits!==null){
      if(cost>0&&credits<cost)
        html+=`<div class="hint warn">Saldo insuficiente para 1 h (tenés ${fmtCr(credits)} cr) — la creación fallará con 402.</div>`;
      else if(cost>0)
        html+=`<div class="hint">≈ ${Math.max(0,Math.floor(credits/cost))} h restantes con tu saldo actual</div>`;
    }
    box.style.display="";box.innerHTML=html;
  };
  (kind==="vm"?["cCpu","cRam","cDisk"]:["cRep","cCpu","cRam"])
    .forEach(id=>{const el=m.querySelector("#"+id);if(el)el.addEventListener("input",recalc);});
  const gpu=m.querySelector("#cGpu"); if(gpu)gpu.addEventListener("change",recalc);
  recalc();
}

  }
}
/* ── isla React (<nubecita-launch-wizard>) ────────────────────────────────
   Camino de integración moderno: si web/react-island.js está deployado,
   «+ Crear VM» abre el wizard React (React Query) dentro del mismo modal.
   El island se carga LAZY (script dinámico) solo al primer clic; si 404 o
   falla el load, window.NubecitaWizard queda sin definir y el modal vanilla
   de siempre sigue siendo el fallback — el vanilla NUNCA se reemplaza. */
let islandLoad=null; // Promise<boolean> — se resuelve una sola vez
function ensureIsland(){
  if(islandLoad)return islandLoad;
  islandLoad=new Promise(res=>{
    const s=document.createElement("script");
    s.src="/react/island.js";
    s.onload=()=>res(!!window.NubecitaWizard);
    s.onerror=()=>res(false);
    document.head.appendChild(s);
  });
  return islandLoad;
}
async function openCreateVmIsland(){
  const m=document.createElement("div");m.id="createModal";m.className="modal show";
  m.innerHTML=`<div class="cbox" style="width:min(560px,92vw)">
    <h3>Crear VM <span class="muted" style="font-size:11px">· wizard React</span></h3>
    <nubecita-launch-wizard></nubecita-launch-wizard>
    <div class="cbtns" style="margin-top:12px">
      <button class="ghost" onclick="closeCreate()">Cancelar</button>
    </div></div>`;
  m.addEventListener("click",e=>{if(e.target===m)closeCreate();});
  // Mismo contrato que submitCreate: la isla despacha 'nc-created' (composed,
  // atraviesa la shadow root) con la fila optimista ya formada.
  m.addEventListener("nc-created",async e=>{
    const r=e.detail;
    insertVmRow(r);
    okT(`VM en preparación${r.gpu_mapping?` · GPU ${r.gpu_model||r.gpu_mapping}`:""} · ${r.name} — aparece como «provisioning» y pasa a running en ~1 min.`);

}

/* Fila optimista: insertar la fila nueva en el cache y re-dibujar SIN esperar
   al re-fetch de clientData() — la VM aparece en pantalla de inmediato (<2s). */
function insertVmRow(r){
  vmsCache.l=[...vmsCache.l.filter(x=>x.ref_id!==r.ref_id),r];
  drawVms(vmsCache.l);
}
function insertSvcRow(r){
  svcsCache.l=[...svcsCache.l.filter(x=>x.ref_id!==r.ref_id),r];
  drawSvcs(svcsCache.l);
}
async function submitCreate(kind,btn){
  const isVm=kind==="vm";
  busy(btn,"Creando…");
  try{
    if(isVm){
      const gpuModel=$("#cGpu").value||"";
      const r=await api("/vm","POST",{name:$("#cName").value.trim()||null,
        cpu:+$("#cCpu").value,ram_gb:+$("#cRam").value,disk_gb:+$("#cDisk").value,
        gpu:!!gpuModel,gpu_model:gpuModel});
      // Fila optimista en el cache local: la VM sale en pantalla de inmediato,
      // con status='provisioning' y los campos que ya conocemos. El WS /ws/events
      // la actualiza a 'running' cuando termina el background (polling 30s de
      // respaldo si el socket está caído).
      const [ip]=String(r.ip||"").split("/");
      insertVmRow({ref_id:String(r.vmid),name:r.name,cpu:r.cpu,ram_mb:r.ram_gb*1024,
        disk_gb:r.disk_gb,status:"provisioning",host_id:r.host_id||null,
        subnet:ip?parseInt(ip.split(".")[2]):null,
        gpu_mapping:r.gpu?r.gpu_model||"gpu":null,gpu_model:r.gpu_model||null});
      okT(`VM en preparación${r.gpu?` · GPU ${r.gpu_model||""}`.trim():""} · ${r.name}${r.ip?` · ${r.ip}`:""} — aparece como «provisioning» y pasa a running en ~1 min${r.gpu?" (2-3 min con GPU)":""}.`);
      closeCreate();
      cacheBust("/me/");cacheBust("/quota");cacheBust("/vm");
      await clientData();
    }else{
      const r=await api("/service","POST",{name:$("#cName").value.trim(),image:$("#cImg").value.trim(),
        cpu:+$("#cCpu").value,ram_mb:+$("#cRam").value,replicas:+$("#cRep").value});
      insertSvcRow({ref_id:r.job_id,name:r.name,cpu:r.cpu,ram_mb:r.ram_mb,status:"running"});
      okT(`Servicio ${r.job_id} creado`);
      closeCreate();
      cacheBust("/me/");cacheBust("/quota");cacheBust("/vm");
      await clientData();
    }
  }catch(e){errT(e.message);}
  finally{unbusy(btn);}
}

/* Start/stop de una VM del cliente: el backend espera a PVE (igual que admin)
   y actualiza el ledger; acá se muestra busy hasta que responda. */
async function vmPower(vmid,action,btn){
  const label=action==="start"?"Arrancando…":"Deteniendo…";
  const what=action==="start"?"arrancar":"detener";
  if(btn)busy(btn,label);
  const row=vmsCache.l.find(x=>String(x.ref_id)===String(vmid));
  const prev=row?row.status:null;
  if(row&&action==="start")row.status="provisioning";
  if(row)drawVms(vmsCache.l);
  try{
    const r=await api("/vm/"+vmid+"/"+action,"POST");
    toast(`VM ${vmid}: ${what} → «${r.status||"ok"}»`,"ok");
    cacheBust("/me/");cacheBust("/quota");cacheBust("/vm");
  }catch(e){
    if(row&&prev!==null)row.status=prev;
    if(row)drawVms(vmsCache.l);
    errT(e.message);
  }
  finally{if(btn)unbusy(btn);await clientData();}
}

    cacheBust("/me/");cacheBust("/quota");cacheBust("/vm");
  }catch(e){
    if(row&&prev!==null)row.status=prev;
    if(row)drawSvcs(svcsCache.l);

  finally{if(btn)unbusy(btn);await clientData();}

async function savePrivKey(btn){
  busy(btn,"Guardando…");
  try{
    await api("/me/ssh-private-key","PUT",{private_key:$("#privKey").value});
    okT("Clave privada guardada. Usá 🖥 en tu VM para la terminal SSH.");
    const p=$("#privKey");if(p)p.value="";
  }catch(e){errT(e.message);}
  finally{unbusy(btn);}
}
async function copyText(txt,btn){
  try{await navigator.clipboard.writeText(txt);
    const old=btn.textContent;btn.textContent="✔ copiado";
    setTimeout(()=>{btn.textContent=old;},1500);
  }catch(e){prompt("Copiá manualmente:",txt);}
}

/* ── SSH navegador ── */
let sshWs=null,sshTerm=null,sshFit=null;
async function openSsh(vmid,name){
  try{
    const pk=await api("/me/ssh-private-key");
    if(!pk.has){
      errT("No tenés clave privada cargada. Cargala en Configuración → «Mis claves SSH» para usar la terminal SSH. Con solo la clave pública podés SSH desde tu notebook a la IP de la VM.");
      return;
    }
  }catch(e){}
  $("#sshModal").classList.add("show");
  $("#sshTitle").textContent=`SSH → ${name||("VM "+vmid)}`;
  if(sshTerm){try{sshTerm.dispose()}catch(e){}sshTerm=null;}
  const term=new Terminal({cursorBlink:true,fontSize:13,theme:{background:"#001c21",foreground:"#d6eef0"}});
  const fit=new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open($("#sshTerm"));
  fit.fit();
  term.writeln("Conectando…");
  sshTerm=term;sshFit=fit;
  const proto=location.protocol==="https:"?"wss":"ws";
  const ws=new WebSocket(`${proto}://${location.host}/ws/ssh/${vmid}?token=${encodeURIComponent(session.token)}`);
  sshWs=ws;ws.binaryType="arraybuffer";
  ws.onopen=()=>{term.clear();term.focus();ws.send(JSON.stringify({cols:term.cols,rows:term.rows}));};
  ws.onmessage=e=>{const d=e.data instanceof ArrayBuffer?new Uint8Array(e.data):e.data;term.write(d);};
  ws.onclose=e=>{term.writeln("\r\n[desconectado]"+(e.reason?" ("+e.reason+")":""));};
  ws.onerror=()=>term.writeln("[error de conexión]");
  term.onData=d=>{if(ws.readyState===1)ws.send(d);};
  term.onResize=r=>{if(ws.readyState===1)ws.send(JSON.stringify(r));};
}
function closeSsh(){
  if(sshWs){try{sshWs.close()}catch(e){}sshWs=null;}
  if(sshTerm){try{sshTerm.dispose()}catch(e){}sshTerm=null;}
  $("#sshModal").classList.remove("show");
}


/* ══════════ Soporte (cliente): reportes de bugs ══════════ */
const TICKET_CAT=[["bug","Bug"],["cuenta","Cuenta / acceso"],["recursos","Recursos"],["facturacion","Facturación / créditos"],["otro","Otro"]];
const TICKET_ST={open:"Abierto",in_progress:"En progreso",resolved:"Resuelto",closed:"Cerrado"};
function ticketPill(st){return `<span class="pill t_${st}">${TICKET_ST[st]||esc(st)}</span>`;}
function catLabel(k){return (TICKET_CAT.find(x=>x[0]===k)||[])[1]||esc(k);}
let bugsPaneLoaded=false;
async function renderBugs(){
  const bp=$("#clBugsPane"); if(!bp)return;
  if(!bugsPaneLoaded){
    bp.innerHTML=`
    <div class="card">
      <div style="display:flex;align-items:center;gap:10px">
        <h2 style="margin:0;flex:1">Mis reportes</h2>
        <span class="hint" style="margin:0 0 0 0">¿Algo no anda? Contanos y un admin lo revisa.</span>
        <button onclick="openBugModal()" style="white-space:nowrap">+ Reportar un problema</button>
      </div>
      <div id="bugsList" class="mt" data-err="bugsList">${skelTable()}</div>
    </div>`;
  }
  const d=await api("/tickets");
  bugsPaneLoaded=true;
  drawBugs(d.tickets);
}
function drawBugs(list){
  const host=$("#bugsList"); if(!host)return;
  host.innerHTML=list.length
    ?`<div class="tblwrap"><table><tr><th>#</th><th>Título</th><th>Categoría</th><th>Estado</th><th>Respuestas</th><th>Creado</th></tr>
     ${list.map(t=>`<tr style="cursor:pointer" onclick="openBugDetail(${t.id})">
       <td class="mono" style="font-size:12px">#${t.id}</td>
       <td>${esc(t.title)}</td>
       <td class="muted" style="font-size:12px">${catLabel(t.category)}</td>
       <td>${ticketPill(t.status)}</td>
       <td class="muted" style="font-size:12px">${t.n_replies}</td>
       <td class="muted" style="font-size:12px">${fdate(t.created_at)}</td>
     </tr>`).join("")}
     </table></div>`
    :`<div class="empty">Sin reportes todavía.</div>`;
}
function openBugModal(){
  const m=document.createElement("div");m.id="bugModal";m.className="modal show";
  m.innerHTML=`<div class="cbox" style="width:min(560px,92vw)">
    <h3>Reportar un problema</h3>
    <p class="muted" style="margin-top:0">Contanos qué pasó: qué estabas haciendo, qué esperabas y qué pasó en vez. Un admin lo revisa desde su panel.</p>
    <div class="fld"><label>Título</label><input id="bugTitle" maxlength="200" style="margin-top:0" placeholder="ej. VM quedó en «provisioning» hace 20 min"></div>
    <div class="fld"><label>Categoría</label>
      <select id="bugCat">${TICKET_CAT.map(([k,l])=>`<option value="${k}">${l}</option>`).join("")}</select></div>
    <div class="fld"><label>Detalle</label><textarea id="bugDesc" rows="5" maxlength="8000" placeholder="Pasos para reproducir, mensajes de error…" style="font:12px var(--mono)"></textarea></div>
    <div class="msg" id="bugMsg"></div>
    <div class="cbtns">
      <button class="ghost" onclick="closeBugModal()">Cancelar</button>
      <button id="bugGo" onclick="submitBug(this)">Enviar</button>
    </div></div>`;
  m.addEventListener("click",e=>{if(e.target===m)closeBugModal();});
  document.body.appendChild(m);
  setTimeout(()=>{const f=$("#bugTitle");if(f)f.focus();},60);
}
function closeBugModal(){const m=$("#bugModal");if(m)m.remove();}
async function submitBug(btn){
  busy(btn,"Enviando…");
  try{
    const r=await api("/tickets","POST",{
      title:$("#bugTitle").value,description:$("#bugDesc").value,category:$("#bugCat").value});
    closeBugModal();
    okT(`Reporte #${r.id} enviado — un admin lo va a revisar`);
    bugsPaneLoaded=false;
    if(clientTab==="bugs")renderBugs();
  }catch(e){setMsg($("#bugMsg"),e.message,"err");}
  finally{unbusy(btn);}
}
async function openBugDetail(tid){
  let t;try{t=await api("/tickets/"+tid);}catch(e){errT(e.message);return;}
  const m=document.createElement("div");m.id="bugDetailModal";m.className="modal show";
  m.innerHTML=`<div class="cbox" style="width:min(640px,94vw);max-height:86vh;overflow:auto">
    <h3>#${t.id} · ${esc(t.title)} ${ticketPill(t.status)}</h3>
    <p class="hint" style="margin-top:0">${catLabel(t.category)} · enviado ${fdate(t.created_at)}${t.updated_at&&t.updated_at!==t.created_at?` · actualizado ${fdate(t.updated_at)}`:""}</p>
    <pre style="white-space:pre-wrap;font:13px var(--mono);background:#0d1420;padding:10px;border-radius:8px;margin:0 0 12px">${esc(t.description)}</pre>
    ${t.admin_note?`<div class="hint">Nota del admin: ${esc(t.admin_note)}</div>`:""}
    <h3 style="font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 8px">Hilo</h3>
    <div id="bugReplies">${t.replies.map(r=>`
      <div style="margin-bottom:10px"><div class="hint" style="margin:0 0 2px">${r.username==="admin"?"<b>Admin</b>":esc(r.username)} · ${fdate(r.created_at)}</div>
      <pre style="white-space:pre-wrap;font:13px var(--mono);background:#0d1420;padding:8px;border-radius:8px;margin:0">${esc(r.body)}</pre></div>`).join("")
      ||`<div class="empty" style="padding:6px">Sin mensajes todavía.</div>`}</div>
    ${t.status!=="closed"
      ?`<div class="fld mt"><label>Agregar un mensaje</label><textarea id="bugReply" rows="3" maxlength="8000"></textarea></div>
         <div class="cbtns"><button class="ghost" onclick="closeBugDetail()">Cerrar</button>
         <button id="bugReplyBtn" onclick="sendBugReply(${t.id},this)">Enviar</button></div>`
      :`<div class="hint">Este ticket está cerrado.</div>
        <div class="cbtns"><button class="ghost" onclick="closeBugDetail()">Cerrar</button></div>`}
  </div>`;
  m.addEventListener("click",e=>{if(e.target===m)closeBugDetail();});
  document.body.appendChild(m);
}
function closeBugDetail(){const m=$("#bugDetailModal");if(m)m.remove();}
async function sendBugReply(tid,btn){
  busy(btn,"Enviando…");
  try{
    await api(`/tickets/${tid}/replies`,"POST",{body:$("#bugReply").value});
    closeBugDetail();okT("mensaje enviado");
    if(clientTab==="bugs")renderBugs();
  }catch(e){errT(e.message);}
  finally{if(btn)unbusy(btn);}
}

(async()=>{
  try{const b=await fetch("/api/brand");const d=await b.json();if(d&&d.domain)brand=d;}catch(e){}

if(saved){try{session=JSON.parse(saved);enterApp();}catch(e){}}
